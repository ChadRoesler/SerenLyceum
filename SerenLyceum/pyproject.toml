[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-lyceum"
dynamic = ["version"]
description = "Train your own model without reading fifty papers first: a dataset in, a model out, on this box or a rented GPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Chad Roesler" }]
keywords = ["llm", "fine-tuning", "lora", "training", "runpod", "seren"]

# The service is the front door and stays light: no torch, no transformers.
# Training is a separate command run in a separate environment (the [train]
# extra), forked, never imported - the same rule Theatre's stagehand keeps, so
# the service runs on a box with no GPU and the viewer never waits on CUDA.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    # The shared Seren core: token resolution, config/version helpers, the auth
    # middleware, the exposure check, the viewer baseplate.
    "seren-meninges>=6.0.0,<7",
    # Shared request logging.
    "seren-sinew>=5.3.0,<6",  # 5.3.0: request ids carried to the next hop (request_id_hooks / request_id_scope), seren_sinew.atomic
]

[project.optional-dependencies]
# What `seren-lyceum-train` needs, in the TRAINING environment - never the
# service's. torch itself is not listed: which build is right (CUDA version,
# aarch64 or x86, a cloud image that already has it) is the box's to know, and
# the Starwright card and the cloud plugins install it first.
train = [
    "transformers>=4.56",
    "peft>=0.17",
    "trl>=0.23",
    "datasets>=3.0",
    "accelerate>=1.0",
    "pyyaml>=6.0.2",
    # llama.cpp's convert_hf_to_gguf.py, run in this environment for the
    # GGUF: its Qwen path imports sentencepiece before it falls back to BPE
    "sentencepiece>=0.1.98",
    "protobuf>=4.21",
]
corp = [
    # Corporate / intercepting-proxy support.
    "truststore>=0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Kept as an EMPTY alias, like the rest of the family: update checking is core
# in seren-meninges, and the name still appears in installers and notes.
updates = []

[project.scripts]
seren-lyceum = "seren_lyceum.__main__:main"
seren-lyceum-train = "seren_lyceum.trainer.cli:main"

[project.urls]
Homepage = "https://github.com/ChadRoesler/SerenLyceum"
Repository = "https://github.com/ChadRoesler/SerenLyceum"
"Bug Tracker" = "https://github.com/ChadRoesler/SerenLyceum/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["seren_lyceum*"]

# Ship the viewer inside the wheel so GET /viewer works on an installed copy.
[tool.setuptools.package-data]
seren_lyceum = ["viewer/ui/*.html", "viewer/ui/*.css", "viewer/ui/*.js"]

[tool.setuptools_scm]
# .git is one level above pyproject.toml (repo root, not the SerenLyceum subdir)
root = ".."
version_scheme = "release-branch-semver"
version_file = "seren_lyceum/_version.py"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
