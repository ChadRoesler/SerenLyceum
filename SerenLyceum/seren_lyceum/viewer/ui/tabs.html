<!-- Shell contract: class="tab" data-tab=<id>, matching .view sections in
     body.html; the shell styles them and activates the first. Trainings
     leads because "how is it going" is the question asked most; New
     training is where a person starts one without knowing the words. -->
<button class="tab" data-tab="trainings" onclick="switchTab('trainings')">Trainings <span class="tab-count" id="count-running"></span></button>
<button class="tab" data-tab="new" onclick="switchTab('new')">New training</button>
<button class="tab" data-tab="datasets" onclick="switchTab('datasets')">Datasets</button>
<button class="tab" data-tab="box" onclick="switchTab('box')">Config</button>
